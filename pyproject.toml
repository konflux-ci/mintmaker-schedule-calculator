[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mintmaker-schedule-calculator"
version = "0.1.0"
description = "Backend for MintMaker UI schedule timers — reads CronJob and Renovate schedules and calculates upcoming runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cron-converter>=1.3.1",
    "kubernetes>=35.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mintmaker_schedule_calculator"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/I/W: programming standards; F/B: correctness; S: static security (flake8-bandit);
# UP/SIM/RUF: modern idioms, simplify, ruff-specific
select = ["E", "F", "I", "S", "B", "UP", "SIM", "RUF", "W"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assert as the assertion API
"tests/**" = ["S101"]
